name: Post to Bluesky

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      history:
        description: "History backend (none, file)"
        default: "file"
        type: string
      input:
        description: "Input source (rss)"
        default: "rss"
        type: string
      transform:
        description: "Transform (passthrough, groq)"
        default: "groq"
        type: string
      output:
        description: "Output target (console, file, bluesky)"
        default: "bluesky"
        type: string

env:
  ELM_HOME: ${{ github.workspace }}/.elm

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g elm elm-pages

      - uses: actions/cache@v4
        with:
          path: ${{ env.ELM_HOME }}
          key: elm-${{ hashFiles('script/elm.json') }}
          restore-keys: |
            elm-

      - run: >-
          elm-pages run Main
          --history=${{ inputs.history || 'file' }}
          --input=${{ inputs.input || 'rss' }}
          --transform=${{ inputs.transform || 'groq' }}
          --output=${{ inputs.output || 'bluesky' }}
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.txt
          git diff --cached --quiet || git commit -m "Update log.txt" && git push
